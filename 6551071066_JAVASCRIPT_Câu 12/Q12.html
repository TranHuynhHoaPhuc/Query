<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">	
<title>Câu 12 - Checkbox Div Hide Show</title>
<link rel="stylesheet" href="css/bootstrap.min.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css?family=Lato:400,700,900|Open+Sans:300,400|Oswald:400,700');
* { padding: 0; margin: 0; box-sizing: border-box }
body {font-family:'Lato',sans-serif;padding: 30px;}

h4{text-align: center}

.checkbox-card{
	border: 1px solid #f4f4f4;
	padding: 15px;
	margin-bottom: 15px;
}

.passport-box{
	display: none;
	margin-top: 10px;
}

.apply-box{
	margin-top: 10px;
	display: none;
}
</style>
</head>

<body>
<h4>Checkbox Div Hide Show</h4>

<div class="checkbox-card">
	<label>Do You have Passport</label>
	<div class="checkbox">
		<label>
			<input type="checkbox" class="checkme"> Yes
		</label>
	</div>
	<div class="passport-box">
		<input type="text" placeholder="Enter Passport Number" class="form-control">
	</div>
	<div class="apply-box">
		<a href="#">Apply For Passport</a>
	</div>
</div>

<br>

<div class="checkbox-card">
	<label>Do You have Credit Card</label>
	<div class="checkbox">
		<label>
			<input type="checkbox" class="checkme"> Yes
		</label>
	</div>
	<div class="passport-box">
		<input type="text" placeholder="Enter Credit Card Number" class="form-control">
	</div>
	<div class="apply-box">
		<a href="#">Apply For Credit Card</a>
	</div>
</div>

<script>
$(document).ready(function(){
	$('.checkme').click(function(){
		var parent = $(this).closest('.checkbox-card'); 
		if($(this).is(':checked')){
			parent.find('.passport-box').slideDown();
			parent.find('.apply-box').slideDown();
		} else {
			parent.find('.passport-box').slideUp();
			parent.find('.apply-box').slideUp();
		}
	});
});
</script>

</body>
</html>
