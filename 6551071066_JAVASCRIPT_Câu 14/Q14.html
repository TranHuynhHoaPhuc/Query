<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Home</title>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">


<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>


    <div class="image-effect" id="image-effect-2">
        <img src="images/off.png" class="fadeEffect">
        <img src="images/on.png">
    </div>


    <div class="switch-btn">
        <div class="onoffswitch">
            <input type="checkbox" name="onoffswitch" class="onoffswitch-checkbox toggle-switch-2" id="myonoffswitch" tabindex="0" checked>
            <label class="onoffswitch-label" for="myonoffswitch">
                <span class="onoffswitch-inner"></span>
                <span class="onoffswitch-switch"></span>
            </label>
        </div>
    </div>

    <script>
    $(document).ready(function(){
        $("#myonoffswitch").change(function(){
            if($(this).is(":checked")) {
               
                $("body").css({
                    "background": "#ffffff",
                    "color": "#000"
                });
                $("#image-effect-2 img").eq(0).addClass("fadeEffect");
                $("#image-effect-2 img").eq(1).removeClass("fadeEffect");
            } else {
                
                $("body").css({
                    "background": "#121212",
                    "color": "#fff"
                });
                $("#image-effect-2 img").eq(0).removeClass("fadeEffect");
                $("#image-effect-2 img").eq(1).addClass("fadeEffect");
            }
        });
    });
    </script>

</body>
</html>
