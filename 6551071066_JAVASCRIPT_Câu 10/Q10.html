<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Máy tính đơn giản</title>
<style>
    body {
        background-color: #f5f5f5;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .calculator {
        background-color: #ddd;
        padding: 10px;
        border: 3px solid #999;
        width: 220px;
        box-shadow: inset 2px 2px 5px #fff, inset -2px -2px 5px #999;
    }
    input[type="text"] {
        width: 200px;
        height: 30px;
        margin: 5px;
        text-align: right;
        font-size: 18px;
        border: 2px inset #ccc;
        box-shadow: inset 2px 2px 3px #fff, inset -2px -2px 3px #999;
    }
    input[type="button"] {
        width: 45px;
        height: 35px;
        margin: 3px;
        font-size: 16px;
        border: 1px solid #999;
        background-color: #eee;
        box-shadow: 2px 2px 5px #999;
        cursor: pointer;
    }
    input[type="button"]:active {
        box-shadow: inset 2px 2px 5px #999;
    }
</style>
</head>

<body>
    <div class="calculator">
        <form name="calc">
            <input type="text" id="display" name="display" placeholder="Nhập biểu thức..." onkeydown="keyInput(event)">
            <br>
            <input type="button" value="1" onclick="addChar('1')">
            <input type="button" value="2" onclick="addChar('2')">
            <input type="button" value="3" onclick="addChar('3')">
            <input type="button" value="+" onclick="addChar('+')"><br>

            <input type="button" value="4" onclick="addChar('4')">
            <input type="button" value="5" onclick="addChar('5')">
            <input type="button" value="6" onclick="addChar('6')">
            <input type="button" value="-" onclick="addChar('-')"><br>

            <input type="button" value="7" onclick="addChar('7')">
            <input type="button" value="8" onclick="addChar('8')">
            <input type="button" value="9" onclick="addChar('9')">
            <input type="button" value="*" onclick="addChar('*')"><br>

            <input type="button" value="C" onclick="clearDisplay()">
            <input type="button" value="0" onclick="addChar('0')">
            <input type="button" value="=" onclick="calculate()">
            <input type="button" value="/" onclick="addChar('/')">
        </form>
    </div>

    <script>
        const display = document.getElementById("display");

        function addChar(c) {
            display.value += c;
        }

        function clearDisplay() {
            display.value = "";
        }

        function calculate() {
            const expr = display.value.trim();
            
            const match = expr.match(/^(-?\d+(\.\d+)?)([+\-*/])(-?\d+(\.\d+)?)$/);
            if (match) {
                const a = parseFloat(match[1]);
                const op = match[3];
                const b = parseFloat(match[4]);
                let result;
                switch (op) {
                    case '+': result = a + b; break;
                    case '-': result = a - b; break;
                    case '*': result = a * b; break;
                    case '/': 
                        if (b === 0) { alert("Không thể chia cho 0!"); return; }
                        result = a / b; break;
                }
                display.value = result;
            } else {
                alert("Biểu thức không hợp lệ! (VD: 3+5, 10/2, 6*7)");
            }
        }

        function keyInput(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                calculate();
            }
        }
    </script>
</body>
</html>
