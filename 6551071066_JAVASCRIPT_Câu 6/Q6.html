<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Count and display items of a dropdown list</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>
<body>
<form>
  Select your favorite Color :
  <select id="mySelect">
    <option>Red</option>
    <option>Green</option>
    <option>Blue</option>
    <option>White</option>
  </select>

  <input type="button" id="btnCount" value="Count and Output all items">
</form>

<script>
$(document).ready(function(){
  $("#btnCount").click(function(){

    var options = $("#mySelect option");
    var count = options.length;
    var message = "Có " + count + " mục trong danh sách:\n";

    options.each(function(index, item){
      message += (index + 1) + ". " + $(item).text() + "\n";
    });

    alert(message);
  });
});
</script>
</body>
</html>
