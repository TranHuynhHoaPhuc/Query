<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Display a random image.</title>
<style type="text/css">
body {margin-top: 30px;}
</style>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div>
    <button id="jsstyle">Show Image</button>
</div>

<div id="imageContainer"></div>

<script>
$(document).ready(function(){
    $("#jsstyle").click(function(){

        var images = [
            {url: "http://farm4.staticflickr.com/3691/11268502654_f28f05966c_m.jpg", width: 240, height: 160},
            {url: "http://farm1.staticflickr.com/33/45336904_1aef569b30_n.jpg", width: 320, height: 195},
            {url: "http://farm6.staticflickr.com/5211/5384592886_80a512e2c9.jpg", width: 500, height: 343}
        ];

        var randomIndex = Math.floor(Math.random() * images.length);
        var selectedImage = images[randomIndex];

        $("#imageContainer").empty().append(
            $("<img>")
                .attr("src", selectedImage.url)
                .attr("width", selectedImage.width)
                .attr("height", selectedImage.height)
        );
    });
});
</script>
</body>
</html>
